name: Deploy Linux Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site.tar.xz
      - ui-compact.css
      - ui-live-terminal.css
      - ui-density.js
      - ui-learning.css
      - ui-learning.js
      - ui-generic.css
      - ui-generic.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract static site
        run: |
          rm -rf _site
          mkdir -p _site
          tar -xJf site.tar.xz -C _site
          test -f _site/index.html

      - name: Apply generic Linux learning UI
        run: |
          cp ui-compact.css _site/ui-compact.css
          cp ui-live-terminal.css _site/ui-live-terminal.css
          cp ui-density.js _site/ui-density.js
          cp ui-learning.css _site/ui-learning.css
          cp ui-learning.js _site/ui-learning.js
          cp ui-generic.css _site/ui-generic.css
          cp ui-generic.js _site/ui-generic.js
          python - <<'PY'
          from pathlib import Path
          import re, json

          root = Path('_site')
          for page in root.glob('*.html'):
              text = page.read_text(encoding='utf-8')
              text = re.sub(r'\bzoom\s*:\s*(?:0?\.8|80%)\s*;?', '', text)

              replacements = [
                  ('Parrot OS Linux基盤ラボ', 'Linux基盤ラボ'),
                  ('Parrot OS Linux 基盤ラボ', 'Linux基盤ラボ'),
                  ('Parrot OSもDebian系なので、ソフトの追加・更新に apt を使えます。', 'このラボではDebian/Ubuntu系を例に、ソフトの追加・更新へ apt を使います。'),
                  ('Parrot OS自体は動いているのに', 'Linuxホスト自体は動いているのに'),
                  ('Parrot OS自身', 'このLinuxホスト自身'),
                  ('Parrot GNU/Linux', 'Linux'),
                  ('Parrot with Linux ', 'Linux with kernel '),
                  ('Parrot → localhost', 'Linux Host → localhost'),
                  ('Parrot → Internet', 'Linux Host → Internet'),
                  ('parrot.local', 'server01.lab.test'),
                  ('learner@parrot', 'learner@server01'),
                  ('root@parrot', 'root@server01'),
                  (' / parrot', ' / server01'),
                  ('Parrot OS', 'Linux Host'),
                  ('Parrot', 'Linux Host'),
              ]
              for old, new in replacements:
                  text = text.replace(old, new)

              assets = [
                  ('ui-compact.css', '<link rel="stylesheet" href="./ui-compact.css?v=11">'),
                  ('ui-live-terminal.css', '<link rel="stylesheet" href="./ui-live-terminal.css?v=11">'),
                  ('ui-learning.css', '<link rel="stylesheet" href="./ui-learning.css?v=11">'),
                  ('ui-generic.css', '<link rel="stylesheet" href="./ui-generic.css?v=11">'),
              ]
              for name, tag in assets:
                  if name not in text:
                      text = text.replace('</head>', '  ' + tag + '\n</head>', 1)
                  else:
                      text = re.sub(r'href="\./'+re.escape(name)+r'(?:\?v=\d+)?"', 'href="./'+name+'?v=11"', text)

              scripts = ['ui-density.js','ui-learning.js','ui-generic.js']
              for name in scripts:
                  if name not in text:
                      text = text.replace('</body>', '  <script src="./'+name+'?v=11"></script>\n</body>', 1)
                  else:
                      text = re.sub(r'src="\./'+re.escape(name)+r'(?:\?v=\d+)?"', 'src="./'+name+'?v=11"', text)

              page.write_text(text, encoding='utf-8')

          learning = root / 'ui-learning.js'
          if learning.exists():
              text = learning.read_text(encoding='utf-8')
              text = text.replace('parrot.local', 'server01.lab.test')
              text = text.replace('learner@parrot', 'learner@server01')
              text = text.replace('root@parrot', 'root@server01')
              learning.write_text(text, encoding='utf-8')

          manifest = root / 'manifest.webmanifest'
          if manifest.exists():
              data = json.loads(manifest.read_text(encoding='utf-8'))
              data['name'] = 'Linux基盤ラボ'
              data['short_name'] = 'Linux Lab'
              data['description'] = 'Linuxコマンド・インフラ構造・障害切り分けを体験的に学ぶシミュレーター'
              manifest.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          sw = root / 'sw.js'
          if sw.exists():
              text = sw.read_text(encoding='utf-8')
              text = re.sub(r'parrot-linux-labs-v[^\'\"]*', 'linux-kiban-lab-v11-command-scope', text)
              text = re.sub(r'linux-kiban-lab-v[^\'\"]*', 'linux-kiban-lab-v11-command-scope', text)
              marker = 'const ASSETS = ['
              additions = (
                  '\n  "./ui-compact.css?v=11",'
                  '\n  "./ui-live-terminal.css?v=11",'
                  '\n  "./ui-learning.css?v=11",'
                  '\n  "./ui-generic.css?v=11",'
                  '\n  "./ui-density.js?v=11",'
                  '\n  "./ui-learning.js?v=11",'
                  '\n  "./ui-generic.js?v=11",'
              )
              if marker in text and './ui-generic.js?v=11' not in text:
                  text = text.replace(marker, marker + additions, 1)
              sw.write_text(text, encoding='utf-8')
          PY

      - name: Verify patched site
        run: |
          grep -q 'Linux基盤ラボ' _site/index.html
          grep -q 'ui-generic.css?v=11' _site/index.html
          grep -q 'ui-generic.js?v=11' _site/index.html
          grep -q 'ui-density.js?v=11' _site/index.html
          grep -q 'mobile-live-command-scope' _site/ui-generic.js
          grep -q 'Linux / Unixで広く利用' _site/ui-generic.js
          grep -q 'nginx固有' _site/ui-generic.js
          grep -q 'server01.lab.test' _site/ui-learning.js
          ! grep -q 'parrot.local' _site/ui-learning.js
          grep -q 'genericizeTree' _site/ui-generic.js
          grep -q 'syncSliderHeight' _site/ui-density.js
          grep -q 'var LABS=' _site/ui-learning.js
          grep -q '"name": "Linux基盤ラボ"' _site/manifest.webmanifest
          ! grep -R -Eq 'Parrot OS|parrot\.local|learner@parrot|root@parrot' _site/*.html
          ! grep -Eq 'zoom[[:space:]]*:[[:space:]]*(0?\.8|80%)' _site/parrot_linux_lab01_web_nginx.html
          ! grep -Eq 'zoom[[:space:]]*:[[:space:]]*(0?\.8|80%)' _site/parrot_linux_lab11_bash_pipes.html
          test -f _site/ui-compact.css
          test -f _site/ui-live-terminal.css
          test -f _site/ui-density.js
          test -f _site/ui-learning.css
          test -f _site/ui-learning.js
          test -f _site/ui-generic.css
          test -f _site/ui-generic.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
