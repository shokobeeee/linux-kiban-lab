name: Deploy Linux Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site.tar.xz
      - ui-compact.css
      - ui-density.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract static site
        run: |
          rm -rf _site
          mkdir -p _site
          tar -xJf site.tar.xz -C _site
          test -f _site/index.html

      - name: Apply full-width swipe mobile UI
        run: |
          cp ui-compact.css _site/ui-compact.css
          cp ui-density.js _site/ui-density.js
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('_site')
          for page in root.glob('*.html'):
              text = page.read_text(encoding='utf-8')
              # Remove the original 80% page zoom. Mobile density is now achieved
              # through spacing/font sizing, never by shrinking the canvas.
              text = re.sub(r'\bzoom\s*:\s*(?:0?\.8|80%)\s*;?', '', text)

              if 'ui-compact.css' not in text:
                  text = text.replace('</head>', '  <link rel="stylesheet" href="./ui-compact.css?v=5">\n</head>', 1)
              else:
                  text = re.sub(r'href="\./ui-compact\.css(?:\?v=\d+)?"', 'href="./ui-compact.css?v=5"', text)

              if 'ui-density.js' not in text:
                  text = text.replace('</body>', '  <script src="./ui-density.js?v=5"></script>\n</body>', 1)
              else:
                  text = re.sub(r'src="\./ui-density\.js(?:\?v=\d+)?"', 'src="./ui-density.js?v=5"', text)
              page.write_text(text, encoding='utf-8')

          sw = root / 'sw.js'
          if sw.exists():
              text = sw.read_text(encoding='utf-8')
              text = re.sub(r'parrot-linux-labs-v[^\'\"]*', 'parrot-linux-labs-v5-slider', text)
              marker = 'const ASSETS = ['
              if marker in text and './ui-compact.css?v=5' not in text:
                  text = text.replace(marker, marker + '\n  "./ui-compact.css?v=5",\n  "./ui-density.js?v=5",', 1)
              sw.write_text(text, encoding='utf-8')
          PY

      - name: Verify patched site
        run: |
          grep -q 'ui-compact.css?v=5' _site/index.html
          grep -q 'ui-density.js?v=5' _site/index.html
          grep -q 'mobile-operation-slider' _site/ui-density.js
          grep -q 'mobile-structure-scroller' _site/ui-compact.css
          ! grep -Eq 'zoom[[:space:]]*:[[:space:]]*(0?\.8|80%)' _site/parrot_linux_lab01_web_nginx.html
          ! grep -Eq 'zoom[[:space:]]*:[[:space:]]*(0?\.8|80%)' _site/parrot_linux_lab02_firewall_complete.html
          test -f _site/ui-compact.css
          test -f _site/ui-density.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
