name: Deploy Linux Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site.tar.xz
      - ui-compact.css
      - ui-live-terminal.css
      - ui-density.js
      - ui-learning.css
      - ui-learning.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract static site
        run: |
          rm -rf _site
          mkdir -p _site
          tar -xJf site.tar.xz -C _site
          test -f _site/index.html

      - name: Apply mobile learning UI
        run: |
          cp ui-compact.css _site/ui-compact.css
          cp ui-live-terminal.css _site/ui-live-terminal.css
          cp ui-density.js _site/ui-density.js
          cp ui-learning.css _site/ui-learning.css
          cp ui-learning.js _site/ui-learning.js
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('_site')
          for page in root.glob('*.html'):
              text = page.read_text(encoding='utf-8')
              text = re.sub(r'\bzoom\s*:\s*(?:0?\.8|80%)\s*;?', '', text)

              assets = [
                  ('ui-compact.css', '<link rel="stylesheet" href="./ui-compact.css?v=7">'),
                  ('ui-live-terminal.css', '<link rel="stylesheet" href="./ui-live-terminal.css?v=7">'),
                  ('ui-learning.css', '<link rel="stylesheet" href="./ui-learning.css?v=7">'),
              ]
              for name, tag in assets:
                  if name not in text:
                      text = text.replace('</head>', '  ' + tag + '\n</head>', 1)
                  else:
                      text = re.sub(r'href="\./'+re.escape(name)+r'(?:\?v=\d+)?"', 'href="./'+name+'?v=7"', text)

              scripts = ['ui-density.js','ui-learning.js']
              for name in scripts:
                  if name not in text:
                      text = text.replace('</body>', '  <script src="./'+name+'?v=7"></script>\n</body>', 1)
                  else:
                      text = re.sub(r'src="\./'+re.escape(name)+r'(?:\?v=\d+)?"', 'src="./'+name+'?v=7"', text)

              page.write_text(text, encoding='utf-8')

          sw = root / 'sw.js'
          if sw.exists():
              text = sw.read_text(encoding='utf-8')
              text = re.sub(r'parrot-linux-labs-v[^\'\"]*', 'parrot-linux-labs-v7-learning-modes', text)
              marker = 'const ASSETS = ['
              additions = (
                  '\n  "./ui-compact.css?v=7",'
                  '\n  "./ui-live-terminal.css?v=7",'
                  '\n  "./ui-learning.css?v=7",'
                  '\n  "./ui-density.js?v=7",'
                  '\n  "./ui-learning.js?v=7",'
              )
              if marker in text and './ui-learning.js?v=7' not in text:
                  text = text.replace(marker, marker + additions, 1)
              sw.write_text(text, encoding='utf-8')
          PY

      - name: Verify patched site
        run: |
          grep -q 'ui-compact.css?v=7' _site/index.html
          grep -q 'ui-live-terminal.css?v=7' _site/index.html
          grep -q 'ui-learning.css?v=7' _site/index.html
          grep -q 'ui-density.js?v=7' _site/index.html
          grep -q 'ui-learning.js?v=7' _site/index.html
          grep -q 'mobile-live-terminal' _site/ui-density.js
          grep -q 'mobile-operation-slider' _site/ui-density.js
          grep -q 'mobile-learning-mode' _site/ui-learning.js
          grep -q 'mobile-learning-mode-buttons' _site/ui-learning.css
          ! grep -Eq 'zoom[[:space:]]*:[[:space:]]*(0?\.8|80%)' _site/parrot_linux_lab01_web_nginx.html
          ! grep -Eq 'zoom[[:space:]]*:[[:space:]]*(0?\.8|80%)' _site/parrot_linux_lab02_firewall_complete.html
          test -f _site/ui-compact.css
          test -f _site/ui-live-terminal.css
          test -f _site/ui-density.js
          test -f _site/ui-learning.css
          test -f _site/ui-learning.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
