name: Deploy Linux Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - site.tar.xz
      - ui-compact.css
      - ui-density.js
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Extract static site
        run: |
          rm -rf _site
          mkdir -p _site
          tar -xJf site.tar.xz -C _site
          test -f _site/index.html

      - name: Apply compact mobile UI
        run: |
          cp ui-compact.css _site/ui-compact.css
          cp ui-density.js _site/ui-density.js
          python - <<'PY'
          from pathlib import Path

          root = Path('_site')
          for page in root.glob('*.html'):
              text = page.read_text(encoding='utf-8')
              if 'ui-compact.css' not in text:
                  text = text.replace('</head>', '  <link rel="stylesheet" href="./ui-compact.css">\n</head>', 1)
              if 'ui-density.js' not in text:
                  text = text.replace('</body>', '  <script src="./ui-density.js"></script>\n</body>', 1)
              page.write_text(text, encoding='utf-8')

          sw = root / 'sw.js'
          if sw.exists():
              text = sw.read_text(encoding='utf-8')
              text = text.replace('parrot-linux-labs-v1', 'parrot-linux-labs-v4-width-fix')
              marker = 'const ASSETS = ['
              if marker in text and './ui-compact.css' not in text:
                  text = text.replace(marker, marker + '\n  "./ui-compact.css",\n  "./ui-density.js",', 1)
              sw.write_text(text, encoding='utf-8')
          PY

      - name: Verify patched site
        run: |
          grep -q 'ui-compact.css' _site/index.html
          grep -q 'ui-density.js' _site/index.html
          grep -q '100vw - 12px' _site/ui-compact.css
          test -f _site/ui-compact.css
          test -f _site/ui-density.js

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
